# HQ Personnel Compendium Pack
# Neon Relic — Personnel Recruitment (Ch 12: Headquarters Management)
# 5 recruitables contacts and specialists. Non-combatants: if a cell location
# is attacked they flee or hide. See docs/chapters/12-headquarters.adoc.
---
- _id: pers001
  name: Station Dispatcher (Police)
  type: npc
  system:
    tier: 1
    personnelType: dispatcher
    dpCost: 2
    hqBonus: 'Once per Case File: request police incident records, scanner traffic intercepts, or a 10-minute window of police non-response in one location.'
    description: >
      A civilian 911 dispatcher who owes the Covenant a significant debt.
      Passes case-relevant police radio traffic when it crosses their desk.
    attributes:
      str: 2
      agi: 2
      wit: 3
      emp: 3
    skills:
      investigate: 2
      persuade: 2
    armorRating: 0
    fearRating: 0

- _id: pers002
  name: Underground Field Medic
  type: npc
  system:
    tier: 1
    personnelType: medic
    dpCost: 2
    hqBonus: 'During downtime, one character may be treated for a non-lethal Critical Injury (Heal (EMP) Difficulty 2 removes the injury without Attribute loss). Does not replace the Basic Medical Bay; stacks with it.'
    description: >
      A struck-off physician — too many questions asked, too many bullet
      wounds treated no-questions-asked. Brilliant in a crisis.
    attributes:
      str: 2
      agi: 2
      wit: 3
      emp: 4
    skills:
      healPhysical: 4
      psychoanalyze: 2
    armorRating: 0
    fearRating: 0

